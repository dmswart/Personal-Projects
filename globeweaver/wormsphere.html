<html>
<head>
    <title>Worm Sphere</title>
    <script src='../d3_pages/d3.v3.min.js'></script>
    <script src='../d3_pages/dmslib_core.js'></script>
    <script src='../d3_pages/dmslib_point2d.js'></script>
    <script src='../d3_pages/dmslib_point3d.js'></script>
    <script src='../d3_pages/dmslib_xfrm.js'></script>

    <script src='../d3_pages/tsp_solver.js'></script>
    <script src='../d3_pages/tsp_tour_generation.js'></script>
    <script src='wormsphere.js'></script>
    <script src='paths.js'></script>
    <script src='draw.js'></script>
</head>

<body>
    <div id="container" style="display:grid; grid-template-columns:1fr 1fr 1fr; grid-gap:10px;">
        <div id="sphere"> </div>
        <div id="plane"> </div>
        <div id="output"> <textarea id="skel" type="text" cols="30" rows="32" style="overflow:scroll"></textarea> </div>
    </div>
    <button onclick="doEnergy(true, true);">Energy</button>
    <button onclick="doEnergy(false, true);">Energy Plane</button>
    <button onclick="doEnergy(true, false);">Energy Sphere</button>
    Iterations: 
    <select name="iterations" id="iterations" value=100>
      <option value=1000>1000</option>
      <option value=100 selected="selected">100</option>
      <option value=10>10</option>
      <option value=1>1</option>
    </select>
    <p></p>
    #Points: 
    <button onclick="increasePoints();">+</button>
    <button onclick="decreasePoints();">-</button>
    <button onclick="outputIntersections();">Output Intersections</button>
    <button onclick="scratch();">Scratch</button>
    <p></p>
    Allow Opposite Points to Cross: 
    <input type="checkbox" id="allowOppositeCrossCheckbox" name="allowOppositeCrossCheckbox" checked="checked"
      onchange="onAllowOppositeCrossChange(this.checked)"/>
    <p></p>
    Show Intersection Points: 
    <input type="checkbox" id="showIntersectionPointsCheckbox" name="showIntersectionPointsCheckbox" checked="checked"
      onchange="onShowIntersectionPointsChange(this.checked)"/>
    <p/>
</body>
</html>

<script>
    // turn off drawing intersections initially
    gDrawingIntersectionsOnSphere = false;
    
    initializeSvgs(PLANE_WIDTH, PLANE_HEIGHT);
    getRandomPath();
    outputPath();
</script>
