<html>
<head>
  <title>Globe Weaver</title>
  <script src='../d3_pages/d3.v3.min.js'></script>
  <script src='../d3_pages/dmslib_core.js'></script>
  <script src='../d3_pages/dmslib_point2d.js'></script>
  <script src='../d3_pages/dmslib_point3d.js'></script>
  <script src='../d3_pages/dmslib_xfrm.js'></script>
  
  <script src='../d3_pages/tsp_solver.js'></script>
  <script src='../d3_pages/tsp_tour_generation.js'></script>
  <script src='IntersectionList.js'></script>
  <script src='IntersectionNode.js'></script>
  <script src='globeweaver.js'></script>
  <script src='draw.js'></script>
  <script src='paths.js'></script>
</head>

<body>
    <div id="container" style="display:grid; grid-template-columns:1fr 1fr 1fr; grid-gap:10px;">
        <div id="sphere"> </div>
        <div id="plane"> </div>
        <div id="output"> <textarea id="skel" type="text" cols="30" rows="32" style="overflow:scroll"></textarea> </div>
    </div>
    <button onclick="doEnergy(true, true);">Energy</button>
    <button onclick="doEnergy(false, true);">Energy Plane</button>
    <button onclick="doEnergy(true, false);">Energy Sphere</button>
    <p/>
    <button onclick="doIntersectionPositions();">Adjust Positions</button>
    <button onclick="increasePoints();">Increase Points</button>
    <button onclick="loadIntersections();">Load</button>
    <button onclick="saveIntersections();">Save</button>
    <p/>
    <!---- a checkbox whether to show or not show the intersection points -->
    Show Intersection Points: 
    <input type="checkbox" id="showIntersectionPointsCheckbox" name="showIntersectionPointsCheckbox" checked="checked"
      onchange="onShowIntersectionPointsChange(this.checked)"/>
    <p/>

    Iterations: 
    <select name="iterations" id="iterations" value=10>
      <option value=10000>10000</option>
      <option value=1000>1000</option>
      <option value=100>100</option>
      <option value=10 selected="selected">10</option>
      <option value=1>1</option>
    </select>
    <p/>
    <div id="scratchInfo" style="visibility:visible; border: 1px solid grey; padding: 10px; margin-top: 10px;">
      Scratch controls:
      <button onclick="scratch();">Scratch</button><br/>
      SphereEnergy: <span id="sphereEnergy">0</span> PlaneEnergy: <span id="planeEnergy">0</span><br/>
      <p></p>
      Node: 
      <input type="number" id="scratchNode" name="scratchNode" 
        min="0" max="50" value="2" style="width:50px;" 
        onchange="onScratchNodeChange(this.value)"/>
      Arm: 
      <input type="number" id="scratchArm" name="scratchArm" 
        min="0" max="1" value="0" style="width:50px;" 
        onchange="onScratchNodeChange(this.value)"/>

      <input type="range" id="scratchValue" name="scratchValue"
        min="0" max="500" style="width:100%;" 
        onchange="onScratchValueChange(this.value)"/>
    </div>
</body>
</html>

<script>
    initializeSvgs(PLANE_WIDTH, PLANE_HEIGHT);
    initializeIntersections();
</script>
